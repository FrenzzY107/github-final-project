name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 nosetests coverage talisman
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # Menghentikan build jika ada error sintaksis Python atau nama yang tidak terdefinisi
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero memperlakukan semua error sebagai peringatan (warning) agar pipeline tetap jalan
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests with nosetests
      run: |
        nosetests --with-spec --spec-color --with-coverage --cover-package=service
